[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-agent-qa-kit"
version = "0.1.0"
description = "Evidence-driven QA contracts for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Safe Agent QA Kit contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
safe-agent-qa = "safe_agent_qa.cli:main"

[tool.setuptools.packages.find]
include = ["safe_agent_qa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
